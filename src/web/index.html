<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>战术板编辑器</title>
    <link rel="stylesheet" href="/editor/styles.css" />
    <script src="/vendor/konva.min.js"></script>
  </head>
  <body>
    <main class="editor-shell" id="editor-shell">
      <aside class="panel sidebar">
        <section class="sidebar-panel asset-panel">
          <div class="sidebar-tabs" role="tablist" aria-label="资源">
            <button id="asset-tab-background" type="button" role="tab" aria-selected="false" aria-controls="asset-panel-background">背景</button>
            <button id="asset-tab-objects" class="active" type="button" role="tab" aria-selected="true" aria-controls="asset-panel-objects">对象</button>
          </div>
          <div id="asset-panel-background" class="asset-tab-panel hidden" role="tabpanel" aria-labelledby="asset-tab-background">
            <div id="background-list" class="background-list" role="radiogroup" aria-label="背景"></div>
          </div>
          <div id="asset-panel-objects" class="asset-tab-panel" role="tabpanel" aria-labelledby="asset-tab-objects">
            <div id="palette-tabs" class="segmented"></div>
            <div id="palette" class="palette" role="tabpanel"></div>
          </div>
        </section>
      </aside>
      <div id="left-panel-resizer" class="panel-resizer" role="separator" aria-label="调整左侧面板宽度" aria-orientation="vertical" tabindex="0"></div>

      <section class="stage-wrap">
        <div class="stage-toolbar">
          <div class="stage-toolbar-row stage-toolbar-main">
            <div class="stage-toolbar-cluster">
              <nav class="app-menubar" role="menubar" aria-label="主菜单">
                <button id="file-menu-button" class="app-menu-trigger" type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-controls="file-menu" data-menu-target="file-menu">
                  <span>文件</span>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
                </button>
                <button id="edit-menu-button" class="app-menu-trigger" type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-controls="edit-menu" data-menu-target="edit-menu">
                  <span>编辑</span>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
                </button>
              </nav>
              <div class="toolbar-group board-name-group" aria-label="画板名称">
                <label class="board-name-field" for="file-name">
                  <span class="board-name-label">文件名</span>
                  <input id="file-name" maxlength="48" placeholder="未命名文件" />
                </label>
              </div>
            </div>
            <div class="toolbar-group top-command-icons" aria-label="常用命令">
              <button id="quick-save-local-board" class="icon-tool" type="button" title="保存文件 Ctrl+S" aria-label="保存文件">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l2 2v16H5z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/></svg>
              </button>
              <button id="quick-save-as-local-board" class="icon-tool" type="button" title="另存为 Ctrl+Shift+S" aria-label="另存为">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l2 2v16H5z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/><path d="M16 14h5"/><path d="M18.5 11.5 21 14l-2.5 2.5"/></svg>
              </button>
              <button id="undo-action" class="icon-tool" type="button" title="撤销" aria-label="撤销" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg>
              </button>
              <button id="redo-action" class="icon-tool" type="button" title="重做" aria-label="重做" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h1"/></svg>
              </button>
              <button id="copy-object" class="icon-tool" type="button" title="复制对象 Ctrl+C" aria-label="复制" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>
              </button>
              <button id="duplicate-object" class="icon-tool" type="button" title="创建副本 Ctrl+D" aria-label="创建副本" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M11 3h8a2 2 0 0 1 2 2v8"/><path d="M3 11v8a2 2 0 0 0 2 2h8"/></svg>
              </button>
              <button id="paste-object" class="icon-tool" type="button" title="粘贴对象 Ctrl+V" aria-label="粘贴" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8l1 3H7z"/><path d="M7 7H5v14h14V7h-2"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>
              </button>
              <button id="clear-board" class="icon-tool danger-tool" type="button" title="清空画板" aria-label="清空" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 14h10l1-14"/><path d="M9 7V4h6v3"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="stage-body">
          <div class="editor-toolrail" role="toolbar" aria-label="编辑工具">
            <button id="align-left" class="icon-tool" type="button" title="左对齐" aria-label="左对齐" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16"/><path d="M8 7h10"/><path d="M8 12h7"/><path d="M8 17h12"/></svg>
            </button>
            <button id="align-center-x" class="icon-tool" type="button" title="水平居中对齐" aria-label="水平居中对齐" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16"/><path d="M7 7h10"/><path d="M9 12h6"/><path d="M5 17h14"/></svg>
            </button>
            <button id="align-right" class="icon-tool" type="button" title="右对齐" aria-label="右对齐" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4v16"/><path d="M6 7h10"/><path d="M9 12h7"/><path d="M4 17h12"/></svg>
            </button>
            <div class="toolrail-separator"></div>
            <button id="align-top" class="icon-tool" type="button" title="顶端对齐" aria-label="顶端对齐" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16"/><path d="M7 8v10"/><path d="M12 8v7"/><path d="M17 8v12"/></svg>
            </button>
            <button id="align-center-y" class="icon-tool" type="button" title="垂直居中对齐" aria-label="垂直居中对齐" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/><path d="M7 7v10"/><path d="M12 9v6"/><path d="M17 5v14"/></svg>
            </button>
            <button id="align-bottom" class="icon-tool" type="button" title="底端对齐" aria-label="底端对齐" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 6v10"/><path d="M12 9v7"/><path d="M17 4v12"/></svg>
            </button>
            <div class="toolrail-separator"></div>
            <button id="tool-group-layers" class="icon-tool" type="button" title="创建组" aria-label="创建组" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 3h9v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9h18"/><path d="M12 13v4"/><path d="M10 15h4"/></svg>
            </button>
            <button id="tool-ungroup-layers" class="icon-tool" type="button" title="解组" aria-label="解组" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 3h9v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9h18"/><path d="M10 15h4"/></svg>
            </button>
          </div>
          <div id="stage-host"></div>
        </div>
        <div class="stage-statusbar" aria-label="画布状态">
          <label class="toolbar-toggle icon-toggle status-toggle" title="吸附到网格" aria-label="吸附">
            <input id="snap-toggle" type="checkbox" />
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v7a5 5 0 0 0 10 0V4"/><path d="M7 8h4"/><path d="M13 8h4"/><path d="M7 20h10"/></svg>
          </label>
          <label class="toolbar-toggle icon-toggle status-toggle" title="显示网格" aria-label="网格">
            <input id="grid-toggle" type="checkbox" />
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 10h16"/><path d="M4 16h16"/><path d="M10 4v16"/><path d="M16 4v16"/></svg>
          </label>
          <div class="toolbar-group grid-density-actions" aria-label="网格密度">
            <span class="status-label">网格</span>
            <input id="grid-density" class="status-range" type="range" min="8" max="64" step="4" value="16" aria-label="网格密度" />
            <output id="grid-density-value" for="grid-density">16px</output>
          </div>
          <div class="toolbar-group grid-opacity-actions" aria-label="网格不透明度">
            <span class="status-label">强度</span>
            <input id="grid-opacity" class="status-range" type="range" min="0.15" max="1" step="0.05" value="0.55" aria-label="网格不透明度" />
            <output id="grid-opacity-value" for="grid-opacity">55%</output>
          </div>
          <div class="toolbar-group zoom-actions" aria-label="缩放">
            <button id="zoom-out" class="icon-tool" type="button" title="缩小 Ctrl+-" aria-label="缩小">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
            </button>
            <input id="zoom-select" class="zoom-range" type="range" min="0.25" max="2" step="0.01" value="1" aria-label="缩放" />
            <button id="zoom-in" class="icon-tool" type="button" title="放大 Ctrl+=" aria-label="放大">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            </button>
            <output id="zoom-value" for="zoom-select">100%</output>
            <button id="fit-stage" class="icon-tool" type="button" title="适配画布 Ctrl+0" aria-label="适配">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            </button>
          </div>
        </div>
      </section>
      <div id="right-panel-resizer" class="panel-resizer" role="separator" aria-label="调整右侧面板宽度" aria-orientation="vertical" tabindex="0"></div>

      <aside class="panel inspector">
        <section class="inspector-section share-section">
          <div class="section-title">分享</div>
          <label class="field share-name-field" for="board-name">
            <span>分享名</span>
            <input id="board-name" maxlength="7" placeholder="分享名" />
          </label>
        </section>
        <section class="inspector-section property-section">
          <div class="section-title">属性</div>
          <div id="empty-state" class="empty-state">选择一个对象</div>
          <div id="inspector-form" class="inspector-form hidden">
            <input id="object-type" class="type-value-input" type="hidden" disabled aria-hidden="true" />
            <div class="inspector-toggles">
              <label class="inspector-toggle icon-toggle" role="button" aria-pressed="false" title="隐藏对象" aria-label="隐藏">
                <input id="object-hidden" type="checkbox" />
                <svg class="toggle-icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="toggle-icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 10.6a3 3 0 0 0 3.8 3.8"/><path d="M6.6 6.9C3.9 8.7 2.5 12 2.5 12s3.5 6 9.5 6c1.7 0 3.1-.4 4.3-1"/><path d="M12 6c6 0 9.5 6 9.5 6a15 15 0 0 1-2.2 2.8"/></svg>
              </label>
              <label class="inspector-toggle icon-toggle" role="button" aria-pressed="false" title="锁定对象" aria-label="锁定">
                <input id="object-locked" type="checkbox" />
                <svg class="toggle-icon-off" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></svg>
                <svg class="toggle-icon-on" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              </label>
            </div>
            <div class="field-grid" data-field="position">
              <label class="field">
                <span>X</span>
                <input id="object-x" type="number" min="0" max="512" />
              </label>
              <label class="field">
                <span>Y</span>
                <input id="object-y" type="number" min="0" max="384" />
              </label>
            </div>
            <div class="field-grid" data-field="transform">
              <label class="field">
                <span>大小</span>
                <input id="object-size" type="number" min="10" max="300" />
              </label>
              <label class="field">
                <span>角度</span>
                <input id="object-angle" type="number" min="0" max="360" />
              </label>
            </div>
            <div class="field-grid inspector-appearance" data-field="appearance">
              <div class="field color-field">
                <span>颜色</span>
                <div class="color-control">
                  <button id="object-color-trigger" class="color-picker-trigger" type="button" title="选择颜色" aria-label="选择颜色">
                    <span id="object-color-preview" class="color-preview"></span>
                  </button>
                  <input id="object-color" class="color-value-input" type="text" readonly tabindex="-1" aria-hidden="true" />
                  <input id="object-color-text" class="color-hex-input" maxlength="7" spellcheck="false" aria-label="颜色值" />
                  <div id="object-color-popover" class="color-popover hidden">
                    <div id="object-color-saturation" class="color-saturation" role="slider" tabindex="0" aria-label="颜色明度和饱和度">
                      <span id="object-color-saturation-handle"></span>
                    </div>
                    <input id="object-color-hue" class="color-hue" type="range" min="0" max="360" value="30" aria-label="色相" />
                    <div id="object-color-swatches" class="color-swatches" aria-label="常用颜色">
                      <button type="button" data-color="#ff8000" title="#ff8000" aria-label="#ff8000"><span style="background:#ff8000"></span></button>
                      <button type="button" data-color="#00ffcc" title="#00ffcc" aria-label="#00ffcc"><span style="background:#00ffcc"></span></button>
                      <button type="button" data-color="#43a8d8" title="#43a8d8" aria-label="#43a8d8"><span style="background:#43a8d8"></span></button>
                      <button type="button" data-color="#ffffff" title="#ffffff" aria-label="#ffffff"><span style="background:#ffffff"></span></button>
                      <button type="button" data-color="#ff4f69" title="#ff4f69" aria-label="#ff4f69"><span style="background:#ff4f69"></span></button>
                      <button type="button" data-color="#9b7cff" title="#9b7cff" aria-label="#9b7cff"><span style="background:#9b7cff"></span></button>
                    </div>
                  </div>
                </div>
              </div>
              <label class="field slider-field">
                <span>透明度</span>
                <div class="slider-control">
                  <input id="object-transparency-range" type="range" min="0" max="100" step="1" aria-label="透明度滑动条" />
                  <input id="object-transparency" type="number" min="0" max="100" />
                </div>
              </label>
            </div>
            <label class="field" data-field="text">
              <span>文字</span>
              <input id="object-text" maxlength="30" />
            </label>
            <div class="field-grid" data-field="line">
              <label class="field">
                <span>终点 X</span>
                <input id="object-end-x" type="number" min="0" max="512" />
              </label>
              <label class="field">
                <span>终点 Y</span>
                <input id="object-end-y" type="number" min="0" max="384" />
              </label>
            </div>
            <div class="field-grid parameter-field-grid" data-field="arc">
              <label class="field slider-field" data-field="arc-angle">
                <span>弧度</span>
                <div class="slider-control">
                  <input id="object-arc-range" type="range" min="10" max="360" step="10" aria-label="弧度滑动条" />
                  <input id="object-arc" type="number" min="10" max="360" step="10" />
                </div>
              </label>
              <label class="field slider-field" data-field="donut-radius">
                <span>内圈</span>
                <div class="slider-control">
                  <input id="object-donut-range" type="range" min="0" max="240" step="1" aria-label="内圈滑动条" />
                  <input id="object-donut" type="number" min="0" max="240" />
                </div>
              </label>
            </div>
          </div>
        </section>

        <section class="inspector-section layers-section">
          <div class="section-title">图层 <span id="layer-count">0</span></div>
          <div class="layer-toolbar">
            <div class="layer-toolbar-group" aria-label="图层顺序">
              <button id="move-top" class="icon-tool" type="button" title="移到顶层" aria-label="移到顶层" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14"/><path d="m12 6-5 5"/><path d="m12 6 5 5"/><path d="M12 6v14"/></svg>
              </button>
              <button id="move-up" class="icon-tool" type="button" title="上移图层" aria-label="上移" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-5 5"/><path d="m12 5 5 5"/><path d="M12 5v14"/></svg>
              </button>
              <button id="move-down" class="icon-tool" type="button" title="下移图层" aria-label="下移" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-5-5"/><path d="m12 19 5-5"/><path d="M12 5v14"/></svg>
              </button>
              <button id="move-bottom" class="icon-tool" type="button" title="移到底层" aria-label="移到底层" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14"/><path d="m12 18-5-5"/><path d="m12 18 5-5"/><path d="M12 4v14"/></svg>
              </button>
            </div>
            <div class="layer-toolbar-group" aria-label="图层分组">
              <button id="group-layers" class="icon-tool" type="button" title="创建组" aria-label="创建组" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 3h9v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9h18"/><path d="M12 13v4"/><path d="M10 15h4"/></svg>
              </button>
              <button id="ungroup-layers" class="icon-tool" type="button" title="解组" aria-label="解组" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 3h9v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9h18"/><path d="M10 15h4"/></svg>
              </button>
            </div>
            <div class="layer-toolbar-group danger-toolbar-group" aria-label="图层删除">
              <button id="delete-object" class="icon-tool danger-tool" type="button" title="删除对象" aria-label="删除" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M6 7l1 14h10l1-14"/><path d="M9 7V4h6v3"/></svg>
              </button>
            </div>
          </div>
          <div id="layers" class="layers"></div>
        </section>
      </aside>
    </main>
    <div id="file-menu" class="file-menu hidden" role="menu" aria-label="文件操作">
      <div class="file-menu-section file-menu-local-actions" aria-label="本地文件">
        <button id="new-local-board" class="file-menu-item" type="button" title="新建文件" aria-label="新建文件" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v5h4"/><path d="M12 11v6"/><path d="M9 14h6"/></svg>
          <span>新建文件</span>
        </button>
        <button id="open-local-board-dialog" class="file-menu-item" type="button" title="打开文件" aria-label="打开文件" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M5 20V6a2 2 0 0 1 2-2h7l5 5v11"/><path d="M14 4v5h5"/><path d="m9 14 3 3 4-5"/></svg>
          <span>打开文件</span>
        </button>
        <button id="save-local-board" class="file-menu-item" type="button" title="保存文件" aria-label="保存文件" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l2 2v16H5z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/></svg>
          <span>保存文件</span>
          <kbd>Ctrl+S</kbd>
        </button>
        <button id="save-as-local-board" class="file-menu-item" type="button" title="另存为" aria-label="另存为" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l2 2v16H5z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/><path d="M16 14h5"/><path d="M18.5 11.5 21 14l-2.5 2.5"/></svg>
          <span>另存为</span>
          <kbd>Ctrl+Shift+S</kbd>
        </button>
        <button id="manage-local-boards" class="file-menu-item" type="button" title="管理文件" aria-label="管理文件" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/><path d="m17 16 2 2 3-4"/></svg>
          <span>管理文件</span>
        </button>
      </div>
      <div class="file-menu-section file-menu-code-actions" aria-label="导入导出">
        <button id="open-import-dialog" class="file-menu-item" type="button" title="导入分享码" aria-label="导入分享码" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v5h4"/><path d="m10 12-3 3 3 3"/><path d="M7 15h8"/><path d="m14 12 3 3-3 3"/></svg>
          <span>导入分享码</span>
        </button>
        <button id="import-project-file" class="file-menu-item" type="button" title="导入工程文件" aria-label="导入工程文件" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M6 19V5h8l4 4v10"/><path d="M14 5v5h4"/><path d="M12 15V9"/><path d="m9 12 3 3 3-3"/></svg>
          <span>导入工程文件</span>
        </button>
        <input id="project-file-input" class="hidden" type="file" accept=".zsb.json,application/json" />
        <button id="open-export-code-dialog" class="file-menu-item" type="button" title="导出分享码" aria-label="导出分享码" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7 4 12l4 5"/><path d="m16 7 4 5-4 5"/><path d="m14 4-4 16"/></svg>
          <span>导出分享码</span>
        </button>
        <button id="export-project-file" class="file-menu-item" type="button" title="导出工程文件" aria-label="导出工程文件" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M6 19V5h8l4 4v10"/><path d="M14 5v5h4"/><path d="M12 9v6"/><path d="m9 12 3 3 3-3"/></svg>
          <span>导出工程文件</span>
        </button>
        <button id="open-export-image-dialog" class="file-menu-item" type="button" title="导出图片" aria-label="导出图片" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m7 17 4-4 3 3 2-2 3 3"/></svg>
          <span>导出图片</span>
        </button>
      </div>
    </div>
    <div id="edit-menu" class="file-menu hidden" role="menu" aria-label="编辑操作">
      <div class="file-menu-section" aria-label="历史">
        <button id="menu-undo-action" class="file-menu-item" type="button" role="menuitem" disabled>
          <span>撤销</span>
          <kbd>Ctrl+Z</kbd>
        </button>
        <button id="menu-redo-action" class="file-menu-item" type="button" role="menuitem" disabled>
          <span>重做</span>
          <kbd>Ctrl+Shift+Z</kbd>
        </button>
      </div>
      <div class="file-menu-section" aria-label="剪贴板">
        <button id="menu-copy-object" class="file-menu-item" type="button" role="menuitem" disabled>
          <span>复制</span>
          <kbd>Ctrl+C</kbd>
        </button>
        <button id="menu-paste-object" class="file-menu-item" type="button" role="menuitem" disabled>
          <span>粘贴</span>
          <kbd>Ctrl+V</kbd>
        </button>
        <button id="menu-duplicate-object" class="file-menu-item" type="button" role="menuitem" disabled>
          <span>创建副本</span>
          <kbd>Ctrl+D</kbd>
        </button>
      </div>
      <div class="file-menu-section" aria-label="删除">
        <button id="menu-delete-object" class="file-menu-item danger-menu-item" type="button" role="menuitem" disabled>
          <span>删除</span>
          <kbd>Del</kbd>
        </button>
        <button id="menu-clear-board" class="file-menu-item danger-menu-item" type="button" role="menuitem" disabled>
          <span>清空画板</span>
        </button>
      </div>
    </div>
    <dialog id="local-board-dialog" class="editor-dialog">
      <form method="dialog" class="dialog-panel">
        <header class="dialog-header">
          <h2>本地文件</h2>
          <button id="close-local-board-dialog" class="icon-button" type="submit" aria-label="关闭">x</button>
        </header>
        <div class="local-board-bulk-actions">
          <button id="select-all-local-boards" type="button" disabled>全选</button>
          <button id="clear-selected-local-boards" type="button" disabled>全不选</button>
          <button id="delete-selected-local-boards" class="danger-button" type="button" disabled>删除所选</button>
        </div>
        <div id="local-board-list" class="local-board-list" aria-label="本地文件列表"></div>
      </form>
    </dialog>
    <dialog id="local-board-name-dialog" class="editor-dialog compact-dialog">
      <form method="dialog" class="dialog-panel">
        <header class="dialog-header">
          <h2 id="local-board-name-title">文件命名</h2>
          <button id="close-local-board-name-dialog" class="icon-button" type="submit" value="cancel" aria-label="关闭">x</button>
        </header>
        <label class="field">
          <span>文件名</span>
          <input id="local-board-name-input" maxlength="48" />
          <span id="local-board-name-error" class="field-error" aria-live="polite"></span>
        </label>
        <footer class="dialog-actions">
          <button id="confirm-local-board-name" type="submit" value="confirm">确定</button>
        </footer>
      </form>
    </dialog>
    <dialog id="import-dialog" class="editor-dialog">
      <form method="dialog" class="dialog-panel">
        <header class="dialog-header">
          <h2>导入战术板代码</h2>
          <button id="close-import-dialog" class="icon-button" type="submit" aria-label="关闭">x</button>
        </header>
        <label class="field">
          <span>战术板代码</span>
          <textarea id="code-input" spellcheck="false"></textarea>
        </label>
        <footer class="dialog-actions">
          <button id="load-code" type="button">导入</button>
        </footer>
      </form>
    </dialog>
    <dialog id="export-code-dialog" class="editor-dialog">
      <form method="dialog" class="dialog-panel">
        <header class="dialog-header">
          <h2>导出分享码</h2>
          <button id="close-export-code-dialog" class="icon-button" type="submit" aria-label="关闭">x</button>
        </header>
        <label class="field">
          <span>分享码</span>
          <textarea id="code-output" spellcheck="false" readonly></textarea>
        </label>
        <footer class="dialog-actions">
          <button id="copy-export-code" type="button">复制分享码</button>
        </footer>
      </form>
    </dialog>
    <dialog id="export-image-dialog" class="editor-dialog">
      <form method="dialog" class="dialog-panel">
        <header class="dialog-header">
          <h2>导出图片</h2>
          <button id="close-export-image-dialog" class="icon-button" type="submit" aria-label="关闭">x</button>
        </header>
        <img id="preview-image" alt="战术板预览图" />
        <footer class="dialog-actions">
          <button id="copy-export-image" type="button">复制图片</button>
          <button id="download-preview-image" type="button">下载图片</button>
        </footer>
      </form>
    </dialog>
    <div id="context-menu" class="context-menu hidden" role="menu">
      <button type="button" role="menuitem" data-context="canvas layer" data-action="copy">复制</button>
      <button type="button" role="menuitem" data-context="canvas" data-action="paste">粘贴</button>
      <button type="button" role="menuitem" data-context="canvas layer" data-action="duplicate">创建副本</button>
      <button type="button" role="menuitem" data-context="canvas layer" data-action="delete">删除</button>
      <div class="context-menu-separator" data-context="canvas"></div>
      <div class="context-icon-grid" data-context="canvas" aria-label="对齐">
        <button class="context-icon" type="button" role="menuitem" data-action="align-left" title="左对齐" aria-label="左对齐">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16"/><path d="M8 7h10"/><path d="M8 12h7"/><path d="M8 17h12"/></svg>
        </button>
        <button class="context-icon" type="button" role="menuitem" data-action="align-center-x" title="水平居中对齐" aria-label="水平居中对齐">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16"/><path d="M7 7h10"/><path d="M9 12h6"/><path d="M5 17h14"/></svg>
        </button>
        <button class="context-icon" type="button" role="menuitem" data-action="align-right" title="右对齐" aria-label="右对齐">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4v16"/><path d="M6 7h10"/><path d="M9 12h7"/><path d="M4 17h12"/></svg>
        </button>
        <button class="context-icon" type="button" role="menuitem" data-action="align-top" title="顶端对齐" aria-label="顶端对齐">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16"/><path d="M7 8v10"/><path d="M12 8v7"/><path d="M17 8v12"/></svg>
        </button>
        <button class="context-icon" type="button" role="menuitem" data-action="align-center-y" title="垂直居中对齐" aria-label="垂直居中对齐">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/><path d="M7 7v10"/><path d="M12 9v6"/><path d="M17 5v14"/></svg>
        </button>
        <button class="context-icon" type="button" role="menuitem" data-action="align-bottom" title="底端对齐" aria-label="底端对齐">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 6v10"/><path d="M12 9v7"/><path d="M17 4v12"/></svg>
        </button>
      </div>
      <div class="context-menu-separator" data-context="layer"></div>
      <button type="button" role="menuitem" data-context="layer" data-action="move-up">上移图层</button>
      <button type="button" role="menuitem" data-context="layer" data-action="move-down">下移图层</button>
      <button type="button" role="menuitem" data-context="layer" data-action="toggle-hidden">切换隐藏</button>
      <button type="button" role="menuitem" data-context="layer" data-action="toggle-locked">切换锁定</button>
    </div>
    <div id="status" class="status" role="status"></div>
    <script type="module" src="/editor/app.js"></script>
  </body>
</html>
